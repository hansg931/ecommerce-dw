# Semantic Layer: 비즈니스 용어 사전
# 사람과 LLM이 함께 읽을 수 있도록 한국어 + 영어 병기

terms:

  # ═══════════════════════════════════════════════════
  # 콘텐츠 성과 지표
  # ═══════════════════════════════════════════════════

  - term_ko: "완주율"
    term_en: "Completion Rate"
    definition_ko: "작품을 시청 완료(Completed)한 유저 비율. 전체 리스트 등록 유저 대비 완료 유저 수로 계산"
    definition_en: "Fraction of users who completed watching out of all users who added the anime to their list"
    formula: "completed_users / total_list_count"
    table: mart_content_performance
    column: completion_rate
    note: "콘텐츠 품질의 핵심 양(+)의 지표. 네이버웹툰의 연재 완독률과 유사"

  - term_ko: "드롭률"
    term_en: "Drop Rate"
    definition_ko: "작품 시청을 중단(Dropped)한 유저 비율. 콘텐츠 품질의 역(-)지표"
    definition_en: "Fraction of users who dropped the anime out of all users who added it to their list"
    formula: "dropped_users / total_list_count"
    table: mart_content_performance
    column: drop_rate
    note: "높을수록 콘텐츠 유지력이 약함. 네이버웹툰의 이탈률과 유사"

  - term_ko: "종합 성과 점수"
    term_en: "Performance Score"
    definition_ko: "콘텐츠의 품질·인기도·유지력을 종합한 정규화 점수 (0~1 범위)"
    definition_en: "Composite normalized score combining quality, popularity, and retention"
    formula: "0.4 × normalized_score + 0.3 × completion_rate + 0.2 × normalized_members + 0.1 × (1 - drop_rate)"
    table: mart_content_performance
    column: performance_score

  - term_ko: "MAL 점수"
    term_en: "MAL Score"
    definition_ko: "MyAnimeList 커뮤니티가 부여한 가중 평균 점수 (1.0~10.0). 작품 품질의 대표 지표"
    definition_en: "MyAnimeList community weighted average score"
    table: mart_content_performance
    column: mal_score
    note: "Positivity Bias 존재 — 평점 분포가 7~8점에 집중. 5점 이하는 전체의 10% 미만"

  - term_ko: "인기도 티어"
    term_en: "Members Tier"
    definition_ko: "Members 수 기준 작품의 인기도 등급. 상위 1% 작품이 전체 Members의 29% 차지 (극단적 롱테일)"
    definition_en: "Popularity tier based on member count — Top 1% anime hold 29% of all members"
    values:
      - "Top 1%: 상위 1% (약 175개 작품)"
      - "Top 5%: 상위 5% (약 878개)"
      - "Top 10%: 상위 10% (약 1,756개)"
      - "Upper Half: 상위 50%"
      - "Lower Half: 하위 50%"

  # ═══════════════════════════════════════════════════
  # 유저 세그먼트 용어
  # ═══════════════════════════════════════════════════

  - term_ko: "유저 티어"
    term_en: "User Tier"
    definition_ko: "유저의 총 평점 부여 수 기준 활동 등급"
    definition_en: "User activity level based on total ratings given"
    values:
      - "Power: 상위 1% (1,132+ ratings). 전체 rating의 9.2% 차지. 평균 평점이 일반 유저보다 낮음 (더 엄격)"
      - "Active: 상위 1~10% (429~1,131 ratings)"
      - "Regular: 상위 10~50% (113~428 ratings)"
      - "Casual: 하위 50% (1~112 ratings)"

  - term_ko: "파워유저"
    term_en: "Power User"
    definition_ko: "상위 1% 활동량의 유저. 전체 평점의 약 9.2%를 차지하며, 일반 유저보다 엄격한 평가 경향"
    definition_en: "Top 1% users by activity — generate 9.2% of all ratings, tend to rate more critically"
    note: "파워유저의 평균 평점 6.86 vs 일반유저 7.94"

  - term_ko: "평점 성향"
    term_en: "Rating Tendency"
    definition_ko: "유저의 평균 평점 기반 분류"
    definition_en: "User classification based on average rating"
    values:
      - "Generous: 평균 8.5+ (관대한 평가)"
      - "Moderate: 평균 7.0~8.5 (보통)"
      - "Critical: 평균 5.5~7.0 (엄격한 평가)"
      - "Very Critical: 평균 5.5 미만 (매우 엄격)"

  - term_ko: "시청 다양성"
    term_en: "Viewing Diversity"
    definition_ko: "유저가 평점을 매긴 고유 작품 수 기준 분류"
    definition_en: "User classification based on unique anime rated"
    values:
      - "Explorer: 500+ 작품"
      - "Regular Viewer: 100~499"
      - "Selective: 30~99"
      - "Newcomer: 30 미만"

  # ═══════════════════════════════════════════════════
  # 장르/콘텐츠 용어
  # ═══════════════════════════════════════════════════

  - term_ko: "장르 건강도 점수"
    term_en: "Genre Health Score"
    definition_ko: "장르의 성장성·품질·인기도·완주율을 종합한 점수"
    definition_en: "Composite score combining genre growth, quality, popularity, and completion rate"
    formula: "0.3 × recent_ratio + 0.3 × normalized_score + 0.2 × popular_ratio + 0.2 × avg_completion_rate"

  - term_ko: "트렌드 분류"
    term_en: "Trend Category"
    definition_ko: "최근 5년(2015-2019) vs 이전 5년(2010-2014) 작품 수 비교 기반 성장 분류"
    definition_en: "Growth classification comparing recent vs previous 5-year periods"
    values:
      - "Growing: 30% 이상 증가"
      - "Declining: 20% 이상 감소"
      - "Stable: 그 외"

  - term_ko: "소스 카테고리"
    term_en: "Source Category"
    definition_ko: "작품의 원작 매체 분류. IP 기반 작품(만화/라노벨 원작)이 오리지널보다 평균 점수가 높음"
    definition_en: "Source material classification — IP-based anime tend to score higher than originals"
    values:
      - "IP-based: 기존 IP 원작 (Manga, Light novel, Visual novel, Novel, Web manga)"
      - "Original: 오리지널 작품"
      - "Other-IP: 기타 원작 (Game, Music 등)"

  - term_ko: "디지털 네이티브"
    term_en: "Digital Native"
    definition_ko: "웹/스트리밍 전용으로 제작된 작품 (ONA 타입). 2015년 이후 급성장 트렌드"
    definition_en: "Web/streaming-native anime (ONA type) — rapidly growing since 2015"

  # ═══════════════════════════════════════════════════
  # 데이터 품질/편향 용어
  # ═══════════════════════════════════════════════════

  - term_ko: "양의 편향 (Positivity Bias)"
    term_en: "Positivity Bias"
    definition_ko: "유저 평점이 7~8점에 극도로 집중되는 현상. 시청 완료 후 평점을 매기는 자기선택 편향이 원인"
    definition_en: "User ratings are heavily concentrated at 7-8 due to self-selection bias — only completed anime get rated"
    note: "분석 시 평균 평점보다 평점 분산, 저평점 비율 등 세밀한 지표가 더 변별력 있음"

  - term_ko: "스파시티 (희소성)"
    term_en: "Sparsity"
    definition_ko: "유저-작품 상호작용 행렬의 빈 비율. MAL 데이터는 98.9% 스파시티"
    definition_en: "Fraction of empty cells in the user-item interaction matrix — 98.9% for MAL data"

  - term_ko: "콜드 스타트"
    term_en: "Cold Start"
    definition_ko: "평점/활동 데이터가 부족한 유저나 작품. 유저 p10=11 ratings, 작품 p10=12 ratings"
    definition_en: "Users or items with insufficient interaction data for meaningful analysis"
