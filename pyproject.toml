[project]
name = "mal-analytics-engineering"
version = "0.1.0"
description = "MyAnimeList Analytics Engineering Portfolio - DW Modeling & LLM Golden Dataset"
authors = [
    {name = "hansg0509"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas (>=2.0,<4)",
    "duckdb (>=1.5.0,<2.0.0)",
    "dbt-core (>=1.11.7,<2.0.0)",
    "dbt-duckdb (>=1.10.1,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "google-genai (>=1.67.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
